<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>إدارة DEZN</title><link rel="stylesheet" href="./style.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>.admin-wrap{max-width:1100px;margin:50px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-card{background:#0d0d0d;border:1px solid #292929;padding:24px;margin-bottom:20px}.admin-card h2{margin-top:0}.admin-actions{display:flex;gap:12px;flex-wrap:wrap}.admin-actions a,.admin-actions button,.admin-head button{padding:11px 18px;border:1px solid #444;background:#111;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.admin-actions .primary{background:#fff;color:#000;border-color:#fff}.status,.note{color:#aaa;line-height:1.9}</style></head>
<body><header class="header"><div class="container header-inner"><a href="index.html" class="logo"><div class="logo-box">DE<br>ZN</div><span class="logo-text">DEZN</span></a><nav class="nav"><a href="index.html">الموقع</a><a href="work.html">المشاريع</a><a href="knowledge.html">المعرفة</a><a href="books.html">المكتبة</a></nav></div></header>
<main class="admin-wrap"><div class="admin-head"><div><h1>لوحة إدارة DEZN</h1><p class="status" id="user"></p></div><button id="logout">تسجيل الخروج</button></div>
<section class="admin-card"><h2>إدارة المحتوى</h2><p class="note">بعد تسجيل الدخول، يمكنك فتح قاعدة بيانات Supabase لإضافة وتعديل المشاريع والمعرفة والكتب. لا تستخدم Service Role Key داخل الموقع.</p>
<div class="admin-actions"><a class="primary" href="https://supabase.com/dashboard/project/rtzwtngoljqosvzadadi/editor">فتح قاعدة البيانات</a><a href="https://supabase.com/dashboard/project/rtzwtngoljqosvzadadi/storage/buckets">إدارة الصور والملفات</a><a href="./index.html">عرض الموقع</a></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const cfg=window.DEZN_SUPABASE_CONFIG||{},client=window.supabase.createClient(cfg.url,cfg.anonKey);
client.auth.getSession().then(({data})=>{if(!data.session){location.href='./login.html';return}document.getElementById('user').textContent='مسجل الدخول: '+(data.session.user.email||'');});
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='./login.html'};
</script></body></html>
