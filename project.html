<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مشروع | DEZN</title><link rel="stylesheet" href="./style.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet"><script src="./supabase-config.js"></script><script src="./supabase.js"></script></head><body><header class="header"><div class="container header-inner"><a href="index.html" class="logo"><div class="logo-box">DE<br>ZN</div><span class="logo-text">DEZN</span></a><div class="search-box"><input type="text" id="searchInput" placeholder="ابحث في الموقع..." autocomplete="off"><button id="searchBtn" type="button" aria-label="بحث">⌕</button></div><nav class="nav"><a href="index.html">الرئيسية</a><a href="work.html">المشاريع</a><a href="books.html">المكتبة</a><a href="knowledge.html">المعرفة</a><a href="founder.html">أحمد رضا</a><a href="contact.html">تواصل</a></nav></div></header>
<section class="page-hero"><div class="container"><div class="breadcrumb"><a href="work.html">المشاريع</a><span>/</span><span id="bcCat">—</span><span>/</span><span id="bcTitle">—</span></div><h1 id="title">—</h1><p class="meta" id="meta"></p><div class="publish-meta" id="publishMeta"></div></div></section><div class="project-layout"><img class="project-main-img" id="mainImg" src="" alt=""><div class="specs" id="specs"></div><div class="project-body" id="body"></div><div class="project-gallery" id="gallery"></div></div><section class="related"><div class="container"><h2>مشاريع مشابهة</h2><div class="related-grid" id="related"></div></div></section><div class="lightbox" id="lightbox"><button type="button" class="lightbox-close" id="lbClose">✕</button><img id="lbImg" src="" alt=""></div><footer class="footer"><div class="container"><div class="footer-logo"><div class="logo-box small">DE<br>ZN</div></div><p>© 2026 DEZN. جميع الحقوق محفوظة.</p></div></footer><script src="./script.js"></script><script src="./projects-data.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'villa', PROJECTS=window.DEZN_PROJECTS||{};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));}
function renderProject(){const base=(window.DEZN_PROJECTS||{})[id]||(window.DEZN_PROJECTS||{}).villa;if(!base)return;document.title=base.title+' | DEZN';document.getElementById('title').textContent=base.title;document.getElementById('bcTitle').textContent=base.title;document.getElementById('bcCat').textContent=base.catLabel;document.getElementById('meta').textContent=base.meta;document.getElementById('publishMeta').innerHTML='<span>الناشر: DEZN</span><span>القسم: '+esc(base.catLabel||'—')+'</span>';document.getElementById('mainImg').src=base.imgs?.[0]||'';document.getElementById('mainImg').alt=base.title;document.getElementById('body').innerHTML=base.body||'';document.getElementById('specs').innerHTML=(base.specs||[]).map(([k,v])=>'<div class="spec-item"><strong>'+esc(k)+'</strong><span>'+esc(v)+'</span></div>').join('');document.getElementById('gallery').innerHTML=(base.imgs||[]).slice(1).map(src=>'<img src="'+src+'" alt="" loading="lazy" data-full="'+src+'">').join('');document.getElementById('mainImg').onclick=()=>openLb(base.imgs?.[0]);document.getElementById('gallery').querySelectorAll('img').forEach(img=>img.onclick=()=>openLb(img.dataset.full||img.src));const rel=Object.entries(window.DEZN_PROJECTS||{}).filter(([k,v])=>k!==id&&v.category===base.category).slice(0,4);document.getElementById('related').innerHTML=rel.map(([k,v])=>'<a href="project.html?id='+k+'" class="suggestion-card"><img src="'+v.imgs[0]+'" alt="'+esc(v.title)+'"><p>'+esc(v.title)+'</p></a>').join('')}
const lb=document.getElementById('lightbox');function openLb(src){document.getElementById('lbImg').src=src;lb.classList.add('open');document.body.style.overflow='hidden'}function closeLb(){lb.classList.remove('open');document.body.style.overflow=''}document.getElementById('lbClose').onclick=closeLb;lb.onclick=e=>{if(e.target===lb)closeLb()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});renderProject();window.addEventListener('dezn-data-ready',renderProject);
</script></body></html>
