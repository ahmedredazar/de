<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المشاريع | DEZN</title><link rel="stylesheet" href="./style.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet"><script src="./supabase-config.js"></script><script src="./supabase.js"></script></head><body><header class="header"><div class="container header-inner"><a href="index.html" class="logo"><div class="logo-box">DE<br>ZN</div><span class="logo-text">DEZN</span></a><div class="search-box"><input type="text" id="searchInput" placeholder="ابحث في الموقع..." autocomplete="off"><button id="searchBtn" type="button" aria-label="بحث">⌕</button></div><nav class="nav"><a href="index.html">الرئيسية</a><a href="work.html">المشاريع</a><a href="books.html">المكتبة</a><a href="knowledge.html">المعرفة</a><a href="founder.html">أحمد رضا</a><a href="contact.html">تواصل</a></nav></div></header>
<section class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">الرئيسية</a><span>/</span><span>المشاريع</span></div><h1>المشاريع</h1><p class="meta">هنا تنشر مشاريعك بالتفاصيل والصور والمساحة والوصف</p></div></section><section class="filters-section"><div class="container"><div class="filters"><button class="filter-btn active" data-filter="all">الكل</button><button class="filter-btn" data-filter="residential">سكني</button><button class="filter-btn" data-filter="commercial">تجاري</button><button class="filter-btn" data-filter="interior">داخلي</button><button class="filter-btn" data-filter="public">عام / ثقافي</button><button class="filter-btn" data-filter="landscape">منتجعات</button></div></div></section><main class="projects"><div class="container"><div class="projects-grid publish-projects" id="projectsGrid"></div><div class="no-results" id="noProjects" style="display:none"><p>لا توجد مشاريع في هذا التصنيف.</p></div></div></main><footer class="footer"><div class="container"><div class="footer-logo"><div class="logo-box small">DE<br>ZN</div></div><p>© 2026 DEZN. جميع الحقوق محفوظة.</p></div></footer><script src="./script.js"></script><script src="./projects-data.js"></script><script>
const DATA=window.DEZN_PROJECTS||{};
function cleanText(html){const d=document.createElement('div');d.innerHTML=html||'';return(d.textContent||'').replace(/\s+/g,' ').trim()}
function renderProjects(filter='all'){const grid=document.getElementById('projectsGrid'),list=Object.entries(window.DEZN_PROJECTS||{}).filter(([id,p])=>filter==='all'||p.category===filter);document.getElementById('noProjects').style.display=list.length?'none':'block';grid.innerHTML=list.map(([id,p])=>'<a href="project.html?id='+encodeURIComponent(id)+'" class="project-card publish-card"><div class="project-image"><img src="'+(p.imgs?.[0]||'')+'" alt="'+p.title+'" loading="lazy"></div><div class="project-info"><h3>'+p.title+'</h3><span>'+p.catLabel+'</span><p class="card-summary">'+cleanText(p.summary||p.body).slice(0,170)+'…</p><div class="card-meta"><span>الناشر: DEZN</span></div></div></a>').join('')}
renderProjects();document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProjects(btn.dataset.filter)}));window.addEventListener('dezn-data-ready',()=>renderProjects(document.querySelector('.filter-btn.active')?.dataset.filter||'all'));
</script></body></html>
